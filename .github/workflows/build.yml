name: Build V30 Kernel

on:
  workflow_dispatch: # 核心：允许手动点火

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: lineage-20 # 显式告诉它：拉取 lineage-20 分支的代码

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Get Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain

      - name: Start Building
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          make O=out lineageos_joan_defconfig
          make -j$(nproc) O=out

      - name: Upload Result
        uses: actions/upload-artifact@v3
        with:
          name: V30-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
