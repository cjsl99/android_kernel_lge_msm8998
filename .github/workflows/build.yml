name: Build V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

      - name: Get Optimized Toolchain
        run: |
          # 使用已经打包好的 Eva-GCC 和 AOSP Clang，专门针对内核编译优化
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 toolchain64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm toolchain32
          # 下载官方 Clang 的稳定精简版
          git clone --depth=1 https://gitlab.com/LeCmnGend/clang-standalone toolchain-clang

      - name: Start Building
        run: |
          # 这样设置路径绝对不会出错
          CLANG_BIN=$(pwd)/toolchain-clang/bin
          GCC64_BIN=$(pwd)/toolchain64/bin
          GCC32_BIN=$(pwd)/toolchain32/bin
          
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"
          export ARCH=arm64
          
          # 修正编译参数
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-none-elf- \
            CROSS_COMPILE_ARM32=arm-none-eabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip
          "

          # 1. 配置
          make $MAKE_ARGS lineageos_joan_defconfig
          
          # 2. 编译
          make -j$(nproc) $MAKE_ARGS

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Result
          path: out/arch/arm64/boot/Image.gz-dtb
