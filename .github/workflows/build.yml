name: Build V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          # 增加 libssl-dev 等必要依赖
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Get Toolchain
        run: |
          # 下载目前最兼容的 Proton Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

      - name: Start Building
        run: |
          # 定义工具链路径，但不要 export 到全局 PATH
          TC_DIR=$(pwd)/toolchain/bin
          
          export ARCH=arm64
          # 只要把这几个核心变量传给 make 就行
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip
          "

          # 1. 配置内核
          make $MAKE_ARGS PATH="$TC_DIR:$PATH" lineageos_joan_defconfig
          
          # 2. 正式编译
          make -j$(nproc) $MAKE_ARGS PATH="$TC_DIR:$PATH"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Result
          path: out/arch/arm64/boot/Image.gz-dtb
