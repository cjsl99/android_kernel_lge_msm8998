name: Build V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # 降级到更稳定的 22.04 环境，避免 24.04 的 libc 冲突
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

      - name: Get Official Toolchain
        run: |
          # 下载 LineageOS 官方使用的预编译 Clang (14.0.6左右，最稳)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain-clang
          # 下载官方交叉编译工具
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain32

      - name: Start Building
        run: |
          # 动态查找 Clang 具体的 bin 目录（官方仓路径较深）
          CLANG_BIN=$(find $(pwd)/toolchain-clang -name "clang" | head -n 1 | xargs dirname)
          GCC64_BIN=$(pwd)/toolchain64/bin
          GCC32_BIN=$(pwd)/toolchain32/bin
          
          export ARCH=arm64
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip
          "

          # 1. 净化环境并配置
          make $MAKE_ARGS lineageos_joan_defconfig
          
          # 2. 正式开始（使用全部 CPU 核心）
          make -j$(nproc) $MAKE_ARGS

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Result
          path: out/arch/arm64/boot/Image.gz-dtb
