name: Build V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Get Toolchains # 重点修改：同时下载64位和32位工具链
        run: |
          # 这是原来的 64位 刀
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain
          # 这是新增的 32位 刀
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain32

      - name: Start Building # 重点修改：告诉系统32位刀在哪里
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/toolchain32/bin/arm-linux-androideabi-
          
          make O=out lineageos_joan_defconfig
          make -j$(nproc) O=out

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Result
          path: out/arch/arm64/boot/Image.gz-dtb
