name: Build V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Get Toolchain # 换成了现代化的 Proton Clang 聚合工具链
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

      - name: Start Building
        run: |
          export ARCH=arm64
          # 把新工具链添加到系统环境变量里
          export PATH=$(pwd)/toolchain/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # CC=clang 是核心：强制使用现代化的 Clang 编译器来做饭
          make O=out lineageos_joan_defconfig CC=clang
          make -j$(nproc) O=out CC=clang

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Result
          path: out/arch/arm64/boot/Image.gz-dtb
