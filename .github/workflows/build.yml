name: Build LG V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    # 使用 22.04 环境，避开新版系统的库冲突
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev \
          clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5

      - name: Patch Source Code
        run: |
          echo "---- 正在修复 tspdrv 源码 Bug ----"
          # 核心修复：把错误的 sys/ 路径改为内核标准的 linux/ 路径
          sed -i 's/<sys\/ioctl.h>/<linux\/ioctl.h>/g' include/uapi/linux/tspdrv.h

      - name: Build Kernel
        run: |
          # 准备输出目录
          mkdir -p out
          
          # 设置环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 定义编译参数
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++
          "

          echo "---- 正在生成配置文件 ----"
          make $MAKE_ARGS lineageos_joan_defconfig

          echo "---- 正在开始全力编译 ----"
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Image
          # 编译成功后的内核镜像路径
          path: out/arch/arm64/boot/Image.gz-dtb
