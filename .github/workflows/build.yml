name: Build V30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev libncurses5

      - name: Get Reliable Toolchain
        run: |
          # 使用 GitHub 上的高可用镜像，规避权限问题
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 toolchain64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm toolchain32
          # 换成这个 GitHub 上的 AOSP Clang 镜像，不需要登录，下载极快
          git clone --depth=1 https://github.com/ZyCromerZ/Clang toolchain-clang

      - name: Start Building
        run: |
          # 1. 暴力赋予所有工具执行权限，防止 Permission denied
          chmod -R +x toolchain64/bin/
          chmod -R +x toolchain32/bin/
          chmod -R +x toolchain-clang/bin/
          
          # 2. 导出绝对路径
          CLANG_BIN=$(pwd)/toolchain-clang/bin
          GCC64_BIN=$(pwd)/toolchain64/bin
          GCC32_BIN=$(pwd)/toolchain32/bin
          
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"
          export ARCH=arm64
          
          # 3. 核心参数：针对 msm8998 的标准 Clang 编译配置
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-none-elf- \
            CROSS_COMPILE_ARM32=arm-none-eabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++
          "

          # 4. 配置并编译
          make $MAKE_ARGS lineageos_joan_defconfig
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-Result
          path: out/arch/arm64/boot/Image.gz-dtb
