name: Build LG V30 Kernel (SuperSpeed Force Unlock)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev \
          clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5

      - name: Extreme Patch (USB 3.0 & Fixes)
        run: |
          # 1. 基础修复 (tspdrv)
          sed -i 's/<sys\/ioctl.h>/<linux\/ioctl.h>/g' include/uapi/linux/tspdrv.h

          # 2. 全局强制设备树 SuperSpeed (覆盖所有可能引用到的 SOC 配置文件)
          echo "---- 正在执行全局设备树速度解封 ----"
          find arch/arm64/boot/dts/ -name "*.dts*" | xargs sed -i 's/qcom,dwc-usb3-msm-speed = <1>/qcom,dwc-usb3-msm-speed = <2>/g'
          find arch/arm64/boot/dts/ -name "*.dts*" | xargs sed -i 's/maximum-speed = "high-speed"/maximum-speed = "super-speed"/g'
          find arch/arm64/boot/dts/ -name "*.dts*" | xargs sed -i 's/maximum-speed = "full-speed"/maximum-speed = "super-speed"/g'

          # 3. 驱动源码手术：强杀 DWC3 降级逻辑
          echo "---- 正在修改 DWC3 核心驱动逻辑 ----"
          # 强制将所有速度赋值点锁定为 SUPER
          find drivers/usb/dwc3 -name "*.c" | xargs sed -i 's/USB_SPEED_HIGH/USB_SPEED_SUPER/g'
          find drivers/usb/dwc3 -name "*.c" | xargs sed -i 's/USB_SPEED_FULL/USB_SPEED_SUPER/g'
          
          # 4. 针对 msm8998 特有的驱动包装层 (dwc3-msm.c)
          # 很多时候是这个包装层根据 extcon (连接器检测) 把速度压下去的
          if [ -f drivers/usb/dwc3/dwc3-msm.c ]; then
            echo "---- 正在解锁 dwc3-msm 包装层限速 ----"
            sed -i 's/USB_SPEED_HIGH/USB_SPEED_SUPER/g' drivers/usb/dwc3/dwc3-msm.c
          fi

      - name: Build Kernel
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++
          "

          make $MAKE_ARGS lineageos_joan_defconfig
          
          # 强制开启高通 USB3 所有的物理层和控制器配置
          {
            echo "CONFIG_USB_RTL8152=y"
            echo "CONFIG_USB_DWC3_MSM=y"
            echo "CONFIG_USB_MSM_SSPHY_QMP=y"
            echo "CONFIG_USB_GADGET_VBUS_DRAW=900" # 关键：将允许的电流提升到 3.0 标准的 900mA
          } >> out/.config

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-SuperForce
          path: out/arch/arm64/boot/Image.gz-dtb
