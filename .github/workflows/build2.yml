name: Build LG V30 Kernel (USB 3.0 Enhanced)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev \
          clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5

      - name: Hardcore Patch (USB 3.0 & Fixes)
        run: |
          echo "---- 1. 修复 tspdrv 源码 Bug ----"
          sed -i 's/<sys\/ioctl.h>/<linux\/ioctl.h>/g' include/uapi/linux/tspdrv.h

          echo "---- 2. 强制解锁设备树 USB 3.0 速度 ----"
          # 寻找所有相关的设备树文件，强制修改速度参数
          find arch/arm64/boot/dts/lge -name "*.dts*" | xargs sed -i 's/qcom,dwc-usb3-msm-speed = <1>/qcom,dwc-usb3-msm-speed = <2>/g'
          find arch/arm64/boot/dts/lge -name "*.dts*" | xargs sed -i 's/maximum-speed = "high-speed"/maximum-speed = "super-speed"/g'

          echo "---- 3. 修改驱动内核源码：禁止降速 ----"
          # 强制将 DWC3 驱动的最大速度硬编码为 SuperSpeed
          if [ -f drivers/usb/dwc3/core.c ]; then
            sed -i 's/dwc->maximum_speed = USB_SPEED_HIGH/dwc->maximum_speed = USB_SPEED_SUPER/g' drivers/usb/dwc3/core.c
            sed -i 's/maximum_speed = USB_SPEED_HIGH/maximum_speed = USB_SPEED_SUPER/g' drivers/usb/dwc3/core.c
          fi

      - name: Build Kernel
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++
          "

          echo "---- 生成配置并追加网卡/3.0参数 ----"
          make $MAKE_ARGS lineageos_joan_defconfig
          
          # 追加配置确保 3.0 控制器和 RTL 网卡全部以内置模式运行
          {
            echo "CONFIG_USB_RTL8152=y"
            echo "CONFIG_USB_USBNET=y"
            echo "CONFIG_USB_DWC3_MSM=y"
            echo "CONFIG_USB_DWC3_PCI=n"
            echo "CONFIG_USB_AUTOSUSPEND_ON_AC=n" # 禁用自动休眠以提高稳定性
          } >> out/.config

          make $MAKE_ARGS olddefconfig

          echo "---- 正在开始全力编译 ----"
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-Kernel-SuperSpeed
          path: out/arch/arm64/boot/Image.gz-dtb
